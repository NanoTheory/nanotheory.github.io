  <line x1="40" y1="35" x2="40" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
  <line x1="75" y1="35" x2="75" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
